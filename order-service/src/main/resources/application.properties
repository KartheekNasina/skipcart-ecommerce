spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/skipcart_db
spring.datasource.username=skipcart_user
spring.datasource.password=skipcart_password123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=skipcart_user
spring.rabbitmq.password=skipcart_password123

# Custom exchange/queue names
skipcart.rabbitmq.exchange=skipcart.order.exchange
skipcart.rabbitmq.order-created-queue=order.created.queue
skipcart.rabbitmq.order-created-routing-key=order.created