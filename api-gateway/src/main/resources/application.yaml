spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: eureka-ui
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"