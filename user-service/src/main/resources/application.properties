spring.application.name=user-service

spring.datasource.url=jdbc:postgresql://localhost:5432/skipcart_db
spring.datasource.username=skipcart_user
spring.datasource.password=skipcart_password123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*

# JWT Configuration
jwt.secret=skipcart-super-secret-key-that-should-be-very-long-and-random-for-production-use-only-change-me
jwt.expiration-ms=86400000