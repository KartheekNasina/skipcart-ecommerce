spring.application.name=notification-service

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=skipcart_user
spring.rabbitmq.password=skipcart_password123

# Same exchange as order-service, but OWN queue name
skipcart.rabbitmq.exchange=skipcart.order.exchange
skipcart.rabbitmq.notification-queue=notification.order.created.queue
skipcart.rabbitmq.order-created-routing-key=order.created

server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*